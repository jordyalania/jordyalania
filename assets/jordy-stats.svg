<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="rank-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; font-weight: 500; }
    .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #f1f5f9; font-weight: 700; }
    .rank-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #38bdf8; text-anchor: middle; }
    .rank-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10px; fill: #10b981; text-anchor: middle; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="492" height="192" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 30)">
    <!-- Terminal / Activity Icon -->
    <path d="M0 2a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H2a2 2 0 01-2-2V2zm3 3l3 2-3 2v-4zm5 4h4v-1H8v1z" fill="#38bdf8" />
    <text x="26" y="11" class="header">Jordy Alania's Engineering Stats</text>
  </g>

  <!-- Metric 1: Total Commits & Contribs -->
  <g transform="translate(25, 68)">
    <circle cx="7" cy="7" r="5" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M7 0v2M7 12v2M0 7h2M12 7h2" stroke="#38bdf8" stroke-width="2" />
    <text x="24" y="11" class="label">Total Contributions:</text>
    <text x="180" y="11" class="value">+1,634 commits</text>
  </g>

  <!-- Metric 2: Repositories & Systems -->
  <g transform="translate(25, 98)">
    <path d="M2 1h10a1 1 0 011 1v11a1 1 0 01-1 1H2a1 1 0 01-1-1V2a1 1 0 011-1zm1 2v9h8V3H3z" fill="#818cf8" />
    <text x="24" y="11" class="label">Repositories &amp; Systems:</text>
    <text x="180" y="11" class="value">57 projects</text>
  </g>

  <!-- Metric 3: Production Apps in Stores -->
  <g transform="translate(25, 128)">
    <rect x="2" y="1" width="10" height="13" rx="2" stroke="#10b981" stroke-width="1.5" fill="none" />
    <circle cx="7" cy="11" r="1" fill="#10b981" />
    <text x="24" y="11" class="label">Published in Stores:</text>
    <text x="180" y="11" class="value">2 Apps (iOS &amp; Android)</text>
  </g>

  <!-- Metric 4: AI & Architecture Specialization -->
  <g transform="translate(25, 158)">
    <path d="M7 1l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z" fill="#f59e0b" />
    <text x="24" y="11" class="label">Top Specialization:</text>
    <text x="165" y="11" class="value">Model Context Protocol (MCP)</text>
  </g>

  <!-- Rank Gauge (Right Side) -->
  <g transform="translate(405, 102)">
    <!-- Glow back circle -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#1e293b" stroke-width="7" />
    <!-- Progress Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#rank-ring)" stroke-width="7"
            stroke-dasharray="290" stroke-dashoffset="35" stroke-linecap="round"
            transform="rotate(-90)" filter="url(#glow)" />
    <!-- Inner subtle fill -->
    <circle cx="0" cy="0" r="38" fill="#090d16" fill-opacity="0.8" />
    <!-- Texts -->
    <text x="0" y="4" class="rank-text">S+</text>
    <text x="0" y="19" class="rank-sub" style="font-size: 8.5px; letter-spacing: 0.6px;">ELITE TECH LEAD</text>
  </g>
</svg>
