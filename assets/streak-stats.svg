<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bg-grad-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111625" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="border-grad-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow-streak" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .streak-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #f97316; }
    .stat-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #f8fafc; text-anchor: middle; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #94a3b8; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.8px; }
    .stat-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="1.5" y="1.5" width="492" height="192" rx="12" fill="url(#bg-grad-streak)" stroke="url(#border-grad-streak)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 28)">
    <!-- Fire Icon in Header -->
    <path d="M6 0C5.5 3 2.5 4.5 2.5 7.5A5.5 5.5 0 008 13a5.5 5.5 0 005.5-5.5c0-4-4.5-5.5-4.5-7.5 0 2-2 3-3 0z" fill="url(#fire-grad)" filter="url(#glow-streak)" />
    <text x="22" y="10" class="streak-title">Engineering Velocity &amp; Streak Metrics</text>
  </g>

  <!-- Separator Line -->
  <line x1="25" y1="42" x2="470" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Column 1: Total Contributions -->
  <g transform="translate(90, 72)">
    <circle cx="0" cy="0" r="18" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-opacity="0.4" stroke-width="1" />
    <path d="M-3 -7C-3.5 -4 -6 -2.5 -6 0.5A6 6 0 000 6.5a6 6 0 006-6C6 -3.5 1.5 -5 1.5 -7c0 2-2 3-3 0z" fill="url(#fire-grad)" />
    <text x="0" y="38" class="stat-num">1,634+</text>
    <text x="0" y="55" class="stat-label">Contributions</text>
    <text x="0" y="69" class="stat-sub">Verified Git Commits</text>
  </g>

  <!-- Column Divider 1 -->
  <line x1="175" y1="58" x2="175" y2="148" stroke="#1e293b" stroke-width="1" />

  <!-- Column 2: Current Streak & Cadence -->
  <g transform="translate(247, 72)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <!-- Lightning bolt -->
    <path d="M2 -8L-6 0h5l-2 8 8-8h-5l2-8z" fill="#38bdf8" filter="url(#glow-streak)" />
    <text x="0" y="38" class="stat-num" fill="#38bdf8">Continuous</text>
    <text x="0" y="55" class="stat-label">Shipping Cadence</text>
    <text x="0" y="69" class="stat-sub">Active Architecture &amp; Code</text>
  </g>

  <!-- Column Divider 2 -->
  <line x1="320" y1="58" x2="320" y2="148" stroke="#1e293b" stroke-width="1" />

  <!-- Column 3: Production Delivery -->
  <g transform="translate(405, 72)">
    <circle cx="0" cy="0" r="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <!-- Check / Rocket -->
    <path d="M-5 0l3 3 7-7" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow-streak)" />
    <text x="0" y="38" class="stat-num">99.8%</text>
    <text x="0" y="55" class="stat-label">Delivery Score</text>
    <text x="0" y="69" class="stat-sub">Production Uptime &amp; RLS</text>
  </g>

  <!-- Bottom Pills Banner -->
  <g transform="translate(25, 160)">
    <rect x="0" y="0" width="445" height="24" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="222" y="16" text-anchor="middle" class="badge-text">🚀 Incubado en Wayra &amp; Santander X · PUCP Telecom · UPM MBA · EAE</text>
  </g>
</svg>
